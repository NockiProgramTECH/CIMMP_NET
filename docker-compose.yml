services:
  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    # En développement, on peut utiliser le serveur interne pour le hot-reload
    # command: python manage.py runserver 0.0.0.0:8000
    # En production (ou test Docker final) :
    command: gunicorn --bind 0.0.0.0:8000 CIMPP.wsgi:application
