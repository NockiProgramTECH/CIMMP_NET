services:
  - type: web
    name: cimpp-api
    runtime: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn CIMPP.wsgi --bind 0.0.0.0:$PORT
    healthCheckPath: /cimppApi/health/

    envVarGroups:
      - django-settings

    envVars:
      # ── Django ──
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: cimmp-net.onrender.com,127.0.0.1,localhost
      - key: CORS_ALLOWED_ORIGINS
        value: https://cimmp-net.onrender.com,http://127.0.0.1:8000
      - key: DISABLE_SSL_REDIRECT
        value: "False"

      # ── Stockage ──
      - key: USE_GARAGE
        value: "False"
      - key: CLOUD_NAME
        sync: false
      - key: API_KEY
        sync: false
      - key: API_SECRET
        sync: false

      # ── Base de données ──
      - key: DB_NAME
        value: CIMPP_DB
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false

      # ── Email ──
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
